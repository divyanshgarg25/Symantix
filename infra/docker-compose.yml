version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: symantix-chromadb
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: unless-stopped

  neo4j:
    image: neo4j:community
    container_name: symantix-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-symantix-secure-password}
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: symantix-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: unless-stopped

  symantix-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: symantix-api
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - NEO4J_URI=bolt://symantix-neo4j:7687
      - CHROMA_HOST=symantix-chromadb
      - CHROMA_PORT=8000
    depends_on:
      - neo4j
      - chromadb
    restart: unless-stopped

volumes:
  chromadb_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
